name: demo pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build with Maven
        run: mvn clean install -DskipTests
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build Docker image
        run: docker build -t thebester14/webchatbackend:latest .
      - name: Push Docker image
        run: docker push thebester14/webchatbackend:latest

  deploy:
    needs: build
    runs-on: [ aws-ec2 ]
    steps:
      - name: Print Working Directory
        run: pwd

      - name: List Files in Home
        run: ls -l ~

      - name: List Files in actions-runner
        run: ls -l ~/actions-runner

      - name: Print User
        run: whoami

      - name: Print Environment Variables
        run: env

      - name: Check Docker Installation
        run: |
          if ! [ -x "$(command -v docker)" ]; then
            echo "Error: Docker is not installed." >&2
            exit 1
          fi

      - name: Docker Version
        run: docker --version

      - name: Pull image from Docker Hub
        run: docker pull thebester14/webchatbackend:latest

      - name: Delete existing container
        run: |
          if [ "$(docker ps -aq -f name=demo)" ]; then
            docker rm -f demo
          fi

      - name: Run Docker container
        run: docker run -d -p 8080:8080 --name demo thebester14/webchatbackend:latest

